name: Deploy to Sakura

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libs
        run: |
          pip install -r requirements.txt

      - name: Generate signals and site
        run: |
          python app/generate_signals.py
          python app/build_site.py

      - name: Deploy website to Sakura
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SAKURA_HOST }}
          username: ${{ secrets.SAKURA_USER }}
          key: ${{ secrets.SAKURA_SSH_KEY }}
          source: "public/*"
          target: "/home/hirohitoito/www/cfi/"
          strip_components: 1

      - name: Upload processed data to Sakura
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SAKURA_HOST }}
          username: ${{ secrets.SAKURA_USER }}
          key: ${{ secrets.SAKURA_SSH_KEY }}
          source: "app/data/*.csv"
          target: "/home/hirohitoito/cfi_data/processed/"
          strip_components: 2
